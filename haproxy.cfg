# Load balancer in front of the two JBoss EAP nodes (active-active).
# A node only receives traffic while GET /engine-rest/process-definition/count answers 200 (active health check:
# it fails while the process engine is not running, unlike /engine-rest/engine, which also answers 200 without engine),
# so a node that is stopped, restarting or still deploying is taken out automatically.
global
    log stdout format raw local0
    # runtime API: rolling-upgrade.sh puts a node into maintenance before stopping it (no failed requests)
    stats socket ipv4@0.0.0.0:9999 level admin

defaults
    mode http
    log global
    option httplog
    timeout connect 2s
    timeout client 30s
    timeout server 30s
    option redispatch
    retries 3
    retry-on conn-failure empty-response 503

resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 1s

frontend engine
    bind :8080
    default_backend eap_nodes

backend eap_nodes
    # random instead of roundrobin: requests spread over both nodes even when several clients share the balancer
    balance random
    option httpchk GET /engine-rest/process-definition/count
    http-check expect status 200
    # browsers (Cockpit/Webclient) stay on one node via cookie; API clients without cookies are spread over both nodes
    cookie SRV insert indirect nocache
    http-response set-header X-Served-By %s
    default-server inter 2s fall 2 rise 2 resolvers docker init-addr last,libc,none
    server node1 node1:8080 check cookie node1
    server node2 node2:8080 check cookie node2

frontend stats
    bind :8404
    stats enable
    stats uri /
    stats refresh 2s
    stats show-legends
